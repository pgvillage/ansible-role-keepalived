---
# The default scenario, with VRRP as unicast (keepalived_unicast_peers) instead
# of multicast. It uses the prepare, converge and verify of the default scenario.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  # Privileged, so keepalived can add the VIP and the role can set the
  # (network namespace) sysctls
  - name: keepalived-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    privileged: true
    network: molecule-keepalived-unicast
  - name: keepalived-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    privileged: true
    network: molecule-keepalived-unicast
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        keepalived_unicast_peers: >-
          {{ groups.all | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'address']) | list }}
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
    verify: ../default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
