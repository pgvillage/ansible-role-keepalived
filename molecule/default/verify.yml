---
- name: Verify the cluster
  hosts: all
  vars:
    vip: "{{ ansible_facts.default_ipv4.network | regex_replace('[0-9]+$', '200') }}"
    master: keepalived-el10
    backup: keepalived-el9
  tasks:
    - name: Read the service states
      ansible.builtin.service_facts:

    - name: Check that keepalived runs and is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['keepalived.service'].state == 'running'
          - ansible_facts.services['keepalived.service'].status == 'enabled'

    - name: Read the sysctls set by the role
      ansible.builtin.slurp:
        src: /proc/sys/net/ipv4/ip_nonlocal_bind
      register: nonlocal_bind

    - name: Check that net.ipv4.ip_nonlocal_bind is set
      ansible.builtin.assert:
        that: nonlocal_bind.content | b64decode | trim == '1'

    - name: Check that both nodes have the same virtual router id and password
      ansible.builtin.shell: |
        set -o pipefail
        grep -E 'virtual_router_id|auth_pass' /etc/keepalived/keepalived.conf | sort | sha256sum
      args:
        executable: /bin/bash
      register: vrrp_settings
      changed_when: false

    - name: Compare the virtual router ids and passwords
      ansible.builtin.assert:
        that: vrrp_settings.stdout == hostvars[master].vrrp_settings.stdout
      when: inventory_hostname == backup

    - name: Read the keepalived config
      ansible.builtin.slurp:
        src: /etc/keepalived/keepalived.conf
      register: keepalived_conf

    # The unicast scenario sets keepalived_unicast_peers: only the other node is a peer
    - name: Check the unicast peers
      ansible.builtin.assert:
        that: >-
          (keepalived_conf.content | b64decode | regex_findall('unicast_peer {\\s*([0-9.]+)\\s*}'))
          == (keepalived_unicast_peers | default([]) | reject('eq', ansible_facts.default_ipv4.address) | list)
        fail_msg: "{{ keepalived_conf.content | b64decode }}"

    - name: Read the protocols allowed by firewalld (runtime and permanent)
      ansible.builtin.shell: firewall-cmd --list-protocols && firewall-cmd --permanent --list-protocols
      register: firewalld_protocols
      changed_when: false

    - name: Check that VRRP is allowed in firewalld
      ansible.builtin.assert:
        that: firewalld_protocols.stdout_lines | select('search', 'vrrp') | list | length == 2
        fail_msg: "{{ firewalld_protocols.stdout_lines }}"

    - name: Wait until the master has the VIP
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses
      until: (vip ~ '/' ~ ansible_facts.default_ipv4.prefix) in addresses.stdout
      retries: 15
      delay: 2
      changed_when: false
      when: inventory_hostname == master

    - name: Check that the backup does not have the VIP
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses
      changed_when: false
      failed_when: (vip ~ '/' ~ ansible_facts.default_ipv4.prefix) in addresses.stdout
      when: inventory_hostname == backup

    # Fail over: stop keepalived on the master, and the backup takes the VIP
    - name: Stop keepalived on the master
      ansible.builtin.systemd:
        name: keepalived
        state: stopped
      when: inventory_hostname == master

    - name: Wait until the backup has taken over the VIP
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses
      until: (vip ~ '/' ~ ansible_facts.default_ipv4.prefix) in addresses.stdout
      retries: 15
      delay: 2
      changed_when: false
      when: inventory_hostname == backup

    - name: Start keepalived on the master again
      ansible.builtin.systemd:
        name: keepalived
        state: started
      when: inventory_hostname == master

    - name: Wait until the master has taken the VIP back (it has the higher priority)
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses
      until: (vip ~ '/' ~ ansible_facts.default_ipv4.prefix) in addresses.stdout
      retries: 15
      delay: 2
      changed_when: false
      when: inventory_hostname == master

# Simulate a package upgrade outside the role (e.g. by the linux role or
# unattended-upgrades): replace the keepalived binary (new ctime) after
# keepalived started. Running the role again must then restart keepalived (one
# host at a time), and only then: the role first runs once without the
# replace, and must not restart keepalived.
- name: Verify the restart after an upgraded binary
  hosts: all
  vars:
    vip: "{{ ansible_facts.default_ipv4.network | regex_replace('[0-9]+$', '200') }}"
    master: keepalived-el10
    # As in converge.yml, so only the binary triggers a restart
    keepalived_vip: "{{ vip }}"
    keepalived_vip_cidr: "{{ ansible_facts.default_ipv4.prefix }}"
    keepalived_sysctl_config:
      - key: net.ipv4.ip_nonlocal_bind
        value: "1"
      - key: net.ipv4.ip_forward
        value: "1"
      - key: net.ipv4.tcp_fin_timeout
        value: "20"
  tasks:
    - name: Read the keepalived main pid before the upgrade
      ansible.builtin.systemd_service:
        name: keepalived
      register: pid_before

    - name: Run the role without an upgrade
      ansible.builtin.include_role:
        name: pgvillage.keepalived

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the keepalived main pid after the run without an upgrade
      ansible.builtin.systemd_service:
        name: keepalived
      register: pid_unchanged

    - name: Check that keepalived was not restarted
      ansible.builtin.assert:
        that: pid_unchanged.status.MainPID == pid_before.status.MainPID

    - name: Wait, as the start time and ctime are compared in whole seconds
      ansible.builtin.pause:
        seconds: 2

    - name: Replace the keepalived binary, as a package upgrade does
      ansible.builtin.shell: cp -p /usr/sbin/keepalived /usr/sbin/keepalived.new && mv /usr/sbin/keepalived.new /usr/sbin/keepalived
      changed_when: true

    - name: Run the role again
      ansible.builtin.include_role:
        name: pgvillage.keepalived

    - name: Run the handlers after the upgrade
      ansible.builtin.meta: flush_handlers

    - name: Read the keepalived main pid after the upgrade
      ansible.builtin.systemd_service:
        name: keepalived
      register: pid_after

    - name: Check that keepalived was restarted
      ansible.builtin.assert:
        that:
          - pid_after.status.ActiveState == 'active'
          - pid_after.status.MainPID | int > 0
          - pid_after.status.MainPID != pid_before.status.MainPID
        fail_msg: "PID before: {{ pid_before.status.MainPID }}, after: {{ pid_after.status.MainPID }}"

    - name: Wait until the master has the VIP again
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: addresses
      until: (vip ~ '/' ~ ansible_facts.default_ipv4.prefix) in addresses.stdout
      retries: 15
      delay: 2
      changed_when: false
      when: inventory_hostname == master
