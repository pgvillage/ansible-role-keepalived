---
# Included from the "Restart keepalived" handler once per host, with:
#   keepalived_restart_host: host to restart keepalived on (delegate_to)
# The handler runs once for all hosts, so the variables of the restarted host
# are read from the facts it set when it was notified (hostvars).

- name: "Restart keepalived on {{ keepalived_restart_host }}"
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted
    daemon_reload: true
  delegate_to: "{{ keepalived_restart_host }}"

- name: "Wait until keepalived is active on {{ keepalived_restart_host }}"
  ansible.builtin.systemd_service:
    name: keepalived
  register: keepalived_restart_service
  until: keepalived_restart_service.status.ActiveState | default('') == 'active'
  retries: 15
  delay: 2
  delegate_to: "{{ keepalived_restart_host }}"

# VRRP needs a few advertisements to elect a master again (and a restarted
# master to take the VIP back), so the VIP moves at most once at a time
- name: "Wait for VRRP to settle on {{ keepalived_restart_host }}"
  ansible.builtin.pause:
    seconds: "{{ hostvars[keepalived_restart_host]._keepalived_restart_delay }}"
  when: hostvars[keepalived_restart_host]._keepalived_restart_delay | int > 0

- name: "Mark keepalived as restarted on {{ keepalived_restart_host }}"
  ansible.builtin.set_fact:
    _keepalived_restart_needed: false
  delegate_to: "{{ keepalived_restart_host }}"
  delegate_facts: true
